name: EzzeCV
description: EzzeCV - Offline CV Builder App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.0

  # File System
  path_provider: ^2.1.3

  # NEW: Picking JSON backup files
  file_picker: ^8.1.2

  # Icons
  cupertino_icons: ^1.0.6

  permission_handler: ^11.3.0
  image_picker: ^1.2.1
  image_cropper: ^8.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/splash.gif